<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>404 — Hao Wei Tu</title>
<link rel="icon" href="TTT2.svg" type="image/svg+xml"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --bg: #f5f5f2; --ink: #0a0a0a; --soft: #888884; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 40px 24px;
    -webkit-font-smoothing: antialiased;
  }
  .code {
    font-size: 11px; letter-spacing: .18em; text-transform: uppercase;
    color: var(--soft); margin-bottom: 20px;
  }
  h1 { font-size: clamp(28px, 6vw, 48px); font-weight: 400; line-height: 1.15; margin-bottom: 16px; }
  p { color: var(--soft); font-size: 14px; margin-bottom: 36px; line-height: 1.6; }
  a {
    color: var(--ink); font-size: 12px; letter-spacing: .12em;
    text-transform: uppercase; text-decoration: none;
    border-bottom: 1px solid currentColor; padding-bottom: 1px;
    transition: opacity .2s;
  }
  a:hover { opacity: .5; }
</style>
</head>
<body>
<p class="code">404</p>
<h1>Page not found</h1>
<p>This page doesn't exist or has been moved.</p>
<a href="/">← Back to haoweitu.info</a>
</body>
</html>
